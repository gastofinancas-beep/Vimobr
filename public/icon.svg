<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#231F1A" />
      <stop offset="70%" stop-color="#14110E" />
      <stop offset="100%" stop-color="#0F0D0B" />
    </radialGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC857" />
      <stop offset="50%" stop-color="#F5A524" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#2E2821" stroke-width="4" />
  
  <!-- Subtle plate ring in the center -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#231F1A" stroke-width="8" opacity="0.6" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1A1714" stroke-width="3" opacity="0.8" />

  <!-- Fork Symbol (Garfo) -->
  <g filter="url(#glow)">
    <!-- Prongs -->
    <!-- Center Left -->
    <path d="M 230 110 L 230 200 C 230 230, 240 245, 256 248 C 272 245, 282 230, 282 200 L 282 110" fill="none" stroke="url(#amberGold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Outer Left -->
    <path d="M 194 120 L 194 190 C 194 235, 225 258, 256 260 C 287 258, 318 235, 318 190 L 318 120" fill="none" stroke="url(#amberGold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Prong -->
    <path d="M 256 100 L 256 248" fill="none" stroke="url(#amberGold)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Fork Stem / Handle -->
    <path d="M 256 256 L 256 400" stroke="url(#amberGold)" stroke-width="20" stroke-linecap="round" />
    <!-- Handle bottom drop -->
    <circle cx="256" cy="406" r="12" fill="url(#amberGold)" />
  </g>

  <!-- Small amber star accent -->
  <path d="M 330 110 L 334 122 L 346 124 L 337 132 L 340 144 L 330 137 L 320 144 L 323 132 L 314 124 L 326 122 Z" fill="#F5A524" opacity="0.85" />
</svg>
